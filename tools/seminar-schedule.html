<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>オンラインセミナー 集客スケジュール計算</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1f2328;--sub:#5b6168;--line:#e3e5e8;--bg:#f7f8fa;--card:#fff;--accent:#2f6fde;--accent-soft:#eef3fd;--done:#9aa0a6;--warn:#c98a00}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Noto Sans JP",system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.7}
  .wrap{max-width:760px;margin:0 auto;padding:28px 18px 60px}
  .tag{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);border:1.5px solid var(--accent);border-radius:4px;padding:1px 8px}
  h1{font-size:24px;margin:10px 0 6px;line-height:1.4}
  .lead{color:var(--sub);font-size:14px;margin:0 0 22px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
  .step{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:10px}
  label{font-size:14px;font-weight:500;display:block;margin-bottom:5px}
  input[type=text],input[type=date],input[type=time],input[type=url]{font:inherit;font-size:15px;padding:9px 10px;border:1px solid #cfd3d8;border-radius:8px;width:100%;background:#fff}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .full{grid-column:1/-1}
  .seg{display:flex;border:1px solid #cfd3d8;border-radius:8px;overflow:hidden}
  .seg button{flex:1;font:inherit;font-size:14px;padding:9px 6px;border:0;background:#fff;cursor:pointer;color:var(--sub)}
  .seg button+button{border-left:1px solid #cfd3d8}
  .seg button.on{background:var(--accent);color:#fff;font-weight:700}
  .hint{font-size:12px;color:var(--sub);margin-top:4px}
  .empty{color:var(--sub);font-size:14px;text-align:center;padding:10px}
  .tl{list-style:none;margin:0;padding:0;position:relative}
  .tl:before{content:"";position:absolute;left:11px;top:6px;bottom:6px;width:2px;background:var(--line)}
  .item{position:relative;padding:0 0 18px 34px}
  .item:before{content:"";position:absolute;left:4px;top:6px;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
  .item.main:before{background:var(--accent)}
  .item.past{opacity:.5}
  .item.past:before{border-color:var(--done)}
  .date{font-weight:700;font-size:15px}
  .rel{font-size:12px;color:var(--sub);margin-left:6px}
  .ttl{font-size:16px;font-weight:700;margin:2px 0}
  .desc{font-size:14px;color:#3a3f45;margin:0}
  .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .btn{font:inherit;font-size:13px;border:1px solid #cfd3d8;background:#fff;border-radius:999px;padding:4px 12px;cursor:pointer;color:var(--ink);text-decoration:none}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .tpl{display:none;margin-top:8px;background:var(--accent-soft);border-radius:8px;padding:12px;font-size:13px;white-space:pre-wrap}
  .tpl.open{display:block}
  .warn{font-size:13px;color:var(--warn);margin-top:4px}
  .top-acts{display:flex;gap:8px;justify-content:flex-end;margin-bottom:12px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;padding:8px 16px;border-radius:999px;opacity:0;transition:.2s;pointer-events:none}
  .toast.show{opacity:1}
  footer{margin-top:28px;font-size:13px;color:var(--sub);text-align:center}
  footer b{color:var(--ink)}
  @media (max-width:520px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <span class="tag">無料ツール</span>
  <h1>オンラインセミナー 集客スケジュール計算</h1>
  <p class="lead">開催日を入れるだけで、「いつ・何を告知すればいいか」の日程表と、そのまま使える告知文のひな形が出ます。</p>

  <section class="card">
    <div class="step">STEP 1　セミナーの情報を入れる</div>
    <div class="grid">
      <div class="full"><label for="name">セミナー名</label><input type="text" id="name" placeholder="例：はじめてのInstagram集客講座"></div>
      <div><label for="date">開催日</label><input type="date" id="date"></div>
      <div><label for="time">開始時刻</label><input type="time" id="time" value="20:00"></div>
      <div class="full"><label for="url">申込ページのURL（あれば）</label><input type="url" id="url" placeholder="https://"></div>
      <div><label>参加費</label><div class="seg" id="fee"><button data-v="free" class="on">無料</button><button data-v="paid">有料</button></div></div>
      <div><label>告知期間</label><div class="seg" id="span"><button data-v="4" class="on">4週間</button><button data-v="2">2週間</button></div><div class="hint">初めての開催なら4週間がおすすめ</div></div>
    </div>
  </section>

  <section class="card">
    <div class="step">STEP 2　集客スケジュール</div>
    <div class="top-acts" id="topActs" style="display:none"><button class="btn" id="copyAll">日程表をまとめてコピー</button></div>
    <div id="out"><p class="empty">開催日を入れると、ここに日程表が出ます</p></div>
  </section>

  <footer>
    <div>作成：<b>赤ペンデザイナーマサ</b></div>
    <div>告知バナー・申込ページ・リマインド文など、セミナー集客まわりの制作をお手伝いしています。</div>
  </footer>
</div>
<div class="toast" id="toast">コピーしました</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const W = ['日','月','火','水','木','金','土'];
  const state = {fee:'free', span:'4'};

  document.querySelectorAll('.seg').forEach(seg => {
    seg.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      seg.querySelectorAll('button').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      state[seg.id] = b.dataset.v;
      render();
    });
  });
  ['name','date','time','url'].forEach(id => $(id).addEventListener('input', render));

  // offset: 開催日からの日数（マイナス＝前）、t: 時刻（null＝開始時刻基準の分オフセットを使う）
  function steps(){
    const paid = state.fee === 'paid';
    const four = state.span === '4';
    const s = [];
    if (four) {
      s.push({d:-35, t:'10:00', k:'prep', title:'準備：申込ページと告知画像を作る', desc:'申込フォーム、告知用の画像（SNS用・バナー）、告知文をそろえます。ここが遅れると全部ずれるので最優先で。'});
      s.push({d:-28, t:'12:00', k:'a1', title:'告知①　開催のお知らせ', desc:'SNS・メール・LINEで最初の告知。「誰の・どんな悩みが・どう解決するか」を一番に伝えます。'});
      s.push({d:-21, t:'12:00', k:'a2', title:'告知②　内容をくわしく', desc:'当日話す内容を3つくらいに分けて紹介。講師の実績や、受講後にできるようになることも。'});
      if (paid) s.push({d:-15, t:'20:00', k:'early', title:'告知③　早割の締切まであと1日', desc:'有料なら早割を用意して締切を作ると、申込が動きやすくなります。'});
      s.push({d:-14, t:'12:00', k:'a3', title:(paid?'告知④':'告知③')+'　参加者の声・よくある質問', desc:'過去の参加者の感想や、「初心者でも大丈夫？」などの質問に答える投稿。迷っている人の背中を押します。'});
      s.push({d:-7, t:'12:00', k:'a4', title:(paid?'告知⑤':'告知④')+'　開催1週間前', desc:'「あと1週間」「残り◯席」など、締切を意識してもらう告知。'});
      s.push({d:-3, t:'20:00', k:'last', title:'告知　最終のお知らせ', desc:'申込を迷っている人への最後のひと押し。'});
    } else {
      s.push({d:-17, t:'10:00', k:'prep', title:'準備：申込ページと告知画像を作る', desc:'申込フォーム、告知用の画像、告知文をそろえます。'});
      s.push({d:-14, t:'12:00', k:'a1', title:'告知①　開催のお知らせ', desc:'SNS・メール・LINEで最初の告知。「誰の・どんな悩みが・どう解決するか」を一番に。'});
      if (paid) s.push({d:-8, t:'20:00', k:'early', title:'告知②　早割の締切まであと1日', desc:'締切を作ると申込が動きやすくなります。'});
      s.push({d:-7, t:'12:00', k:'a2', title:(paid?'告知③':'告知②')+'　内容をくわしく・開催1週間前', desc:'話す内容と、受講後にできるようになることを紹介。'});
      s.push({d:-3, t:'20:00', k:'last', title:'告知　最終のお知らせ', desc:'申込を迷っている人への最後のひと押し。'});
    }
    s.push({d:-1, t:'18:00', k:'rem1', title:'リマインド　前日', desc:'申込者全員に、日時と参加URL（Zoomなど）を送ります。ここで当日の参加率が大きく変わります。'});
    s.push({d:0, m:-60, k:'rem2', title:'リマインド　開始1時間前', desc:'参加URLをもう一度送ります。「URLがわからない」問い合わせを防げます。'});
    s.push({d:0, m:0, k:'main', title:'セミナー開催', desc:'冒頭で録画の有無とアンケートのお願いを伝えておくとスムーズです。', main:true});
    s.push({d:1, t:'12:00', k:'thanks', title:'お礼・アンケート・アーカイブ送付', desc:'お礼と一緒にアンケートを送ります。録画があれば期限付きで共有。'});
    s.push({d:3, t:'12:00', k:'next', title:'次の案内', desc:'次回のセミナーや個別相談、有料サービスの案内。満足度が高いうちに。'});
    return s;
  }

  function tpl(k, n, when, url){
    const u = url ? '\n▼お申し込みはこちら\n' + url : '\n▼お申し込みはこちら\n（申込URL）';
    const j = url ? '' : '';
    const T = {
      prep: '【準備するものチェック】\n□ 申込フォーム（名前・メール・質問欄）\n□ 告知用画像（SNS用 1080×1080 など）\n□ 告知文（このページの各ひな形を使えます）\n□ 参加URL（Zoomなど）\n□ アンケートフォーム',
      a1: '【オンラインセミナーのお知らせ】\n「' + n + '」を開催します！\n\n📅 ' + when + '\n💻 オンライン（Zoom）\n\nこんな方におすすめです\n・〇〇で悩んでいる方\n・〇〇をこれから始めたい方' + u,
      a2: '「' + n + '」で話す内容を少しだけご紹介します。\n\n1. 〇〇\n2. 〇〇\n3. 〇〇\n\n終わるころには「〇〇できる」状態をめざします。\n📅 ' + when + u,
      early: '【早割はあすまで】\n「' + n + '」の早割は明日で締切です。\n\n📅 ' + when + '\n早割価格：〇〇円（通常〇〇円）' + u,
      a3: '前回の参加者さんの声をご紹介します。\n\n「〇〇がわかってすっきりしました」\n「初心者でもついていけました」\n\nQ. 初心者でも大丈夫？\nA. はい、〇〇から丁寧にお話しします。\n\n📅 ' + when + u,
      a4: '「' + n + '」まで、あと1週間になりました。\n残り〇席です。\n\n📅 ' + when + u,
      last: '【最終のお知らせ】\n「' + n + '」はいよいよ' + when + '開催です。\n迷っている方、ぜひお気軽にどうぞ。' + u,
      rem1: '〇〇様\n\nあす開催の「' + n + '」のご案内です。\n\n📅 ' + when + '\n▼参加URL\n（ZoomのURL）\n\n開始5分前から入室できます。お会いできるのを楽しみにしています。',
      rem2: 'まもなく「' + n + '」がはじまります。\n▼参加URL\n（ZoomのURL）\n\n入れない場合は、このメッセージに返信してください。',
      main: '【当日の流れメモ】\n・開始：あいさつ、録画の有無、質問の方法\n・本編\n・質疑応答\n・最後：アンケートと次回の案内',
      thanks: '〇〇様\n\n昨日は「' + n + '」にご参加いただき、ありがとうございました。\n\n▼アンケート（2分ほどで終わります）\n（アンケートURL）\n\n▼録画はこちら（〇日まで視聴できます）\n（録画URL）',
      next: '先日の「' + n + '」にご参加いただいた皆さまへ\n\n次回は「〇〇」をテーマに開催します。\n📅 〇月〇日（〇）\n\n個別のご相談も受け付けています。お気軽にどうぞ。'
    };
    return T[k] || '';
  }

  const pad = n => String(n).padStart(2,'0');
  const fmt = d => (d.getMonth()+1) + '/' + d.getDate() + '（' + W[d.getDay()] + '）';
  const fmtT = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
  const gcal = d => d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + 'T' + pad(d.getHours()) + pad(d.getMinutes()) + '00';

  let current = [];

  function render(){
    const ds = $('date').value, ts = $('time').value || '20:00';
    const out = $('out');
    if (!ds) { out.innerHTML = '<p class="empty">開催日を入れると、ここに日程表が出ます</p>'; $('topActs').style.display='none'; return; }
    const name = $('name').value.trim() || '（セミナー名）';
    const url = $('url').value.trim();
    const [y,mo,da] = ds.split('-').map(Number);
    const [hh,mm] = ts.split(':').map(Number);
    const start = new Date(y, mo-1, da, hh, mm);
    const when = (start.getMonth()+1) + '月' + start.getDate() + '日（' + W[start.getDay()] + '）' + fmtT(start) + '〜';
    const now = new Date();
    const firstNeeded = state.span === '4' ? 35 : 17;
    const daysLeft = Math.floor((start - now) / 86400000);

    current = steps().map(s => {
      let d;
      if (s.m !== undefined) { d = new Date(start.getTime() + s.m*60000); }
      else { d = new Date(y, mo-1, da + s.d); const [a,b] = s.t.split(':').map(Number); d.setHours(a,b,0,0); }
      return Object.assign({}, s, {at:d, text:tpl(s.k, name, when, url)});
    });

    let html = '';
    if (daysLeft < firstNeeded && daysLeft >= 0) {
      html += '<p class="warn">⚠ 開催まであと' + daysLeft + '日です。過ぎている項目はとばして、残りの告知を前倒しで進めましょう。</p>';
    } else if (daysLeft < 0) {
      html += '<p class="warn">⚠ 開催日が過去の日付になっています。</p>';
    }
    html += '<ol class="tl">';
    current.forEach((s,i) => {
      const past = s.at < now && !s.main;
      const rel = s.d === 0 ? (s.m === 0 ? '当日' : '当日・開始' + Math.abs(s.m) + '分前') : (s.d < 0 ? Math.abs(s.d) + '日前' : s.d + '日後');
      const end = new Date(s.at.getTime() + (s.main ? 90 : 30)*60000);
      const cal = 'https://calendar.google.com/calendar/render?action=TEMPLATE'
        + '&text=' + encodeURIComponent((s.main ? '' : '【集客】') + s.title.replace(/\s+/g,' ') + '｜' + name)
        + '&dates=' + gcal(s.at) + '/' + gcal(end)
        + '&details=' + encodeURIComponent(s.desc);
      html += '<li class="item' + (s.main ? ' main' : '') + (past ? ' past' : '') + '">'
        + '<div class="date">' + fmt(s.at) + ' ' + fmtT(s.at) + '<span class="rel">' + rel + (past ? '・過ぎています' : '') + '</span></div>'
        + '<div class="ttl">' + s.title + '</div>'
        + '<p class="desc">' + s.desc + '</p>'
        + '<div class="acts">'
        + '<button class="btn" data-open="' + i + '">' + (s.k === 'prep' || s.k === 'main' ? 'チェックリストを見る' : '告知文のひな形を見る') + '</button>'
        + '<a class="btn" href="' + cal + '" target="_blank" rel="noopener">Googleカレンダーに追加</a>'
        + '</div>'
        + '<div class="tpl" id="tpl' + i + '"></div>'
        + '</li>';
    });
    html += '</ol>';
    out.innerHTML = html;
    current.forEach((s,i) => {
      const box = $('tpl' + i);
      box.textContent = s.text;
      const c = document.createElement('div');
      c.style.marginTop = '8px';
      c.innerHTML = '<button class="btn">この文をコピー</button>';
      c.querySelector('button').addEventListener('click', () => copy(s.text));
      box.appendChild(c);
    });
    $('topActs').style.display = 'flex';
  }

  $('out').addEventListener('click', e => {
    const b = e.target.closest('[data-open]'); if (!b) return;
    const box = $('tpl' + b.dataset.open);
    box.classList.toggle('open');
  });

  $('copyAll').addEventListener('click', () => {
    const name = $('name').value.trim() || '（セミナー名）';
    const lines = ['■ ' + name + '　集客スケジュール'];
    current.forEach(s => lines.push(fmt(s.at) + ' ' + fmtT(s.at) + '　' + s.title.replace(/\s+/g,' ')));
    copy(lines.join('\n'));
  });

  function copy(text){
    const done = () => { const t = $('toast'); t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1400); };
    try {
      navigator.clipboard.writeText(text).then(done, () => fallback(text, done));
    } catch(e) { fallback(text, done); }
  }
  function fallback(text, done){
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch(e) {}
    ta.remove();
  }

  // 初期値：5週間後
  const d0 = new Date(); d0.setDate(d0.getDate() + 36);
  $('date').value = d0.getFullYear() + '-' + pad(d0.getMonth()+1) + '-' + pad(d0.getDate());
  render();
})();
</script>
</body>
</html>
