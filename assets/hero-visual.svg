<svg xmlns="http://www.w3.org/2000/svg" viewBox="70 70 1080 560" fill="none" role="img" aria-label="紙・Web・LINEをつなぐデザインを表した抽象グラフィック">
  <defs>
    <linearGradient id="hv-cardA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bfe8fb"/>
      <stop offset="1" stop-color="#52b4ec"/>
    </linearGradient>
    <linearGradient id="hv-cardB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ea0ec"/>
      <stop offset="1" stop-color="#2f58d8"/>
    </linearGradient>
    <linearGradient id="hv-cardC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a66"/>
      <stop offset="1" stop-color="#f0684c"/>
    </linearGradient>
    <linearGradient id="hv-ribbon" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f0684c" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#52b4ec" stop-opacity=".55"/>
      <stop offset="1" stop-color="#2f58d8" stop-opacity=".55"/>
    </linearGradient>
    <filter id="hv-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#13265e" flood-opacity="0.16"/>
    </filter>
  </defs>

  <path d="M110 540 C 300 560, 360 420, 520 400 S 760 300, 860 220 S 1000 120, 1110 110"
        stroke="url(#hv-ribbon)" stroke-width="7" stroke-linecap="round" fill="none"/>
  <circle cx="110" cy="540" r="9" fill="#f0684c" opacity=".75"/>
  <circle cx="1110" cy="110" r="7" fill="#2f58d8" opacity=".6"/>
  <circle cx="700" cy="330" r="5" fill="#ffffff" opacity=".85"/>

  <g filter="url(#hv-soft)" transform="rotate(-9 470 330)">
    <rect x="240" y="170" width="460" height="320" rx="26" fill="url(#hv-cardA)"/>
    <rect x="290" y="230" width="220" height="14" rx="7" fill="#ffffff" opacity=".55"/>
    <rect x="290" y="262" width="300" height="10" rx="5" fill="#ffffff" opacity=".4"/>
    <rect x="290" y="286" width="260" height="10" rx="5" fill="#ffffff" opacity=".4"/>
  </g>

  <g filter="url(#hv-soft)" transform="rotate(7 660 300)">
    <rect x="430" y="150" width="420" height="290" rx="22" fill="url(#hv-cardB)"/>
    <rect x="466" y="186" width="210" height="14" rx="7" fill="#ffffff" opacity=".65"/>
    <rect x="466" y="218" width="150" height="150" rx="12" fill="#ffffff" opacity=".18"/>
    <rect x="630" y="218" width="190" height="68" rx="10" fill="#ffffff" opacity=".22"/>
    <rect x="630" y="300" width="190" height="68" rx="10" fill="#ffffff" opacity=".14"/>
  </g>

  <g filter="url(#hv-soft)" transform="rotate(-5 560 430)">
    <path d="M460 360 h200 a20 20 0 0 1 20 20 v120 a20 20 0 0 1 -20 20 h-200 a20 20 0 0 1 -20 -20 v-120 a20 20 0 0 1 20 -20 z" fill="url(#hv-cardC)"/>
    <path d="M620 360 v40 a20 20 0 0 1 -20 20 h-40 z" fill="#c24c36" opacity=".55"/>
    <circle cx="500" cy="420" r="7" fill="#ffffff" opacity=".9"/>
    <circle cx="528" cy="420" r="7" fill="#ffffff" opacity=".65"/>
    <circle cx="556" cy="420" r="7" fill="#ffffff" opacity=".4"/>
  </g>
</svg>
