<template id="profile-template"><div class="profile"><header class="intro"><h2 class="intro-title">Portfolio<span class="intro-period">.</span></h2><p class="hero-name">masako okawa</p><div class="intro-works"><a href="#design" aria-label="Designの作品を見る"><img src="assets/portfolio-clark-1.webp" width="1444" height="1047" alt="クラーク記念国際高等学校の学校案内"><span>Design <span aria-hidden="true">↗</span></span></a><a href="#illustration" aria-label="Illustrationの作品を見る"><img src="assets/popy-5-2019-08.webp" width="2527" height="1701" alt="通信教材ポピーのブラジルを題材にした外表紙"><span>Illustration <span aria-hidden="true">↗</span></span></a></div></header><section class="profile-bio" aria-labelledby="profile-heading"><h3 id="profile-heading" class="section-heading" data-kicker="BACKGROUND"><span>Profile</span></h3><p>グラフィックデザイナー。<br>約10年間、紙媒体を中心にデザインに携わってきました。制作会社とインハウスの両方で経験を積んでいます。</p><p>学校案内や通信教材、情報誌、採用誌・社内報の制作と進行管理。現在はWeb・LINEの改善や、生成AIを活用した制作支援にも取り組んでいます。</p><p>得意なのは「仕組み化」と「企画」。朱書きの伝達漏れを防ぐ検版アプリや、動画を一括抽出するツールなど、制作現場の課題を見つけて仕組みから作ることを大切にしています。情報誌では、取材記事をもとにした誌面構成や、読者を飽きさせない見せ方の企画にも携わっています。</p><div class="career"><p><span>2020.10 — 現在</span>Ｓｋｙ株式会社（広報課）</p><p><span>2016.04 — 2020.09</span>ペタビット株式会社</p></div></section></div></template><dialog id="image-viewer" aria-label="作品の拡大表示"><button class="viewer-close" aria-label="拡大表示を閉じる">×</button><img id="viewer-image" alt=""><p id="viewer-caption"></p></dialog></body></html>
